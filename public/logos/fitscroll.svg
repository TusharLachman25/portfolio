<svg width="124" height="124" viewBox="0 0 124 124" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FitScroll">
  <defs>
    <linearGradient id="fitscroll-bg" x1="9.7%" y1="6.4%" x2="90.3%" y2="93.6%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>
  <rect width="124" height="124" rx="33" fill="url(#fitscroll-bg)"/>
  <!-- The shackle, drawn open on the right: the block is a commitment device,
       not a jail, and a sealed padlock claims more than the app does. -->
  <path d="M43 54V42a19 19 0 0 1 34.5-11" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
  <rect x="30" y="54" width="64" height="44" rx="11" fill="#ffffff"/>
  <!-- Three banked minutes spending down left to right, in the body of the
       lock: what is actually between you and the feed. -->
  <g fill="#9f1239">
    <rect x="41" y="66" width="42" height="7" rx="3.5"/>
    <rect x="41" y="79" width="27" height="7" rx="3.5"/>
  </g>
</svg>
